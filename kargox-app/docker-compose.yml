services:
  postgres:
    image: postgres:16-alpine
    container_name: kargox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kargoxdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - kargox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kargox -d kargox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kargox-postgres-data:
